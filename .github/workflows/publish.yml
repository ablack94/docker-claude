name: Build and Publish Docker Image to GHCR

on:
  # Rebuild both channels whenever the image definition changes
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
    tags:
      - "v*"

  # Poll for new Claude releases. GitHub can't trigger on pushes to another
  # repo (anthropics/claude-code), so we poll the same release endpoints
  # install.sh uses. A no-op poll takes a few seconds.
  schedule:
    - cron: "7,37 * * * *"

  # Allow manual dispatch to build specific Claude versions
  workflow_dispatch:
    inputs:
      claude_version:
        description: "Claude version to build (e.g. stable, latest, 1.0.1)"
        required: true
        default: "stable"
        type: string
      image_tag:
        description: "Docker image tag to publish (e.g. stable, latest, 1.0.1)"
        required: true
        default: "stable"
        type: string

# Never run two publishes at once: they would race on the rolling tags and on
# the README commit.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # ghcr.io/ablack94/docker-claude
  IMAGE_NAME: ${{ github.repository }}
  # Release metadata bucket used by https://claude.ai/install.sh
  RELEASES_URL: https://downloads.claude.ai/claude-code-releases

jobs:
  # Resolve stable/latest to concrete semvers and work out, per version,
  # whether it needs a build, a retag, or nothing. See .github/scripts/plan.sh.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      channels: ${{ steps.plan.outputs.channels }}
      stable: ${{ steps.plan.outputs.stable }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan builds
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.claude_version }}
          INPUT_TAG: ${{ inputs.image_tag }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: .github/scripts/plan.sh

  publish:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest

    # Required for pushing packages and for OIDC token (attestations)
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    name: ${{ matrix.action }} ${{ matrix.version }}

    steps:
      - name: Checkout repository
        if: matrix.action == 'build'
        uses: actions/checkout@v4

      # Buildx is required for advanced build features (caching, imagetools, etc.)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Retag: the version is already published, point the channel/rolling
      # tags at it. A carbon copy keeps the digest, so existing attestations
      # still apply.
      - name: Retag existing image
        if: matrix.action == 'retag'
        env:
          SOURCE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.version }}
          TAGS: ${{ matrix.tags }}
        run: |
          set -euo pipefail
          args=()
          IFS=',' read -ra refs <<<"$TAGS"
          for ref in "${refs[@]}"; do args+=(--tag "$ref"); done
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$SOURCE"

      # --- Build: standard OCI labels from metadata-action, plus the version.
      # Tags come from the plan, so metadata-action's tag output is unused.
      - name: Extract metadata (labels) for Docker
        id: meta
        if: matrix.action == 'build'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.version=${{ matrix.version }}

      - name: Build and push Docker image
        id: push
        if: matrix.action == 'build'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ matrix.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CLAUDE_VERSION=${{ matrix.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Generate artifact attestation for supply chain security
      - name: Generate artifact attestation
        if: matrix.action == 'build'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Record the current stable/latest versions in README.md. Runs even when
  # publish had nothing to do, so the README converges if it ever drifts.
  # Commits made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
  update-readme:
    needs: [plan, publish]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.channels == 'true' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update README
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: .github/scripts/update-readme.sh "${{ needs.plan.outputs.stable }}" "${{ needs.plan.outputs.latest }}"

      - name: Commit and push if changed
        env:
          STABLE: ${{ needs.plan.outputs.stable }}
          LATEST: ${{ needs.plan.outputs.latest }}
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update README versions (stable ${STABLE}, latest ${LATEST})" -- README.md
          # main may have moved since checkout; rebase onto it before pushing.
          git pull --rebase origin main
          git push origin HEAD:main
